[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "defog-megan"
version = "1.0.0"
description = "Concept-conditioned graph generation: property and concept adapters for DeFoG, Feynman-Kac steering, evaluation and a model zoo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Jonas Teufel", email = "jonseb1998@gmail.com" },
    { name = "Clemens Binz" },
    { name = "Pascal Friederich" },
]
requires-python = ">=3.10,<3.13"
keywords = [
    "graph generation", "discrete flow matching", "conditional generation", "explainable AI",
    "concept explanations", "adapters", "molecular generation", "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# The generator side (models, adapters, composition, Feynman-Kac steering, inpainting) is defog-adapt, released on PyPI.
dependencies = [
    "defog-adapt>=0.1.0",
    "numpy>=1.23",
    "networkx>=2.8",
    "pandas>=1.4",
]

[project.optional-dependencies]
# Molecules: RDKit through defog-adapt's own extra, pinned to the release of the paper's runs. The logP rung's property is
# RDKit's Crippen logP of the decoded molecule, and that value differs between RDKit releases for a small share of molecules
# (11 of 6,833 sampled molecules differ between 2026.03.4 and 2026.09.2, by up to 1.4), which moves the rung's error in the
# fourth decimal. Override the pin only if that does not matter to you; the code warns when another release is installed.
chem = ["defog-adapt[chem]>=0.1.0", "rdkit==2026.3.4"]
# The explainer side: the self-explaining GNN, the concept extraction and the dataset/processing format. Needed for
# Feynman-Kac steering (the GNN is the energy), for grading and for building membership tables of new data; not for
# training adapters or for sampling without steering.
#  * graph_attention_student releases before 1.6.0 load the shipped checkpoints without error and return wrong
#    memberships, so 1.6.0 is a hard floor.
#  * That release pins numpy<2, and from pyarrow 26 on pyarrow requires numpy>=2, so without the cap the stack does not
#    import on Python 3.12 (tested: Python 3.10 to 3.12 work with it).
megan = [
    "graph_attention_student>=1.6.0",
    "megan_global_explanations>=0.6.0",
    "visual_graph_datasets>=0.17.0",
    "pyarrow<26",
]
# The runnable experiments (they are PyComex experiments).
experiments = ["pycomex>=0.27.0"]
dev = ["pytest>=7", "pytest-xdist", "build"]
all = ["defog-megan[chem,megan,experiments,dev]"]

[project.urls]
Homepage = "https://github.com/aimat-lab/defog-megan"
Repository = "https://github.com/aimat-lab/defog-megan"
Generator = "https://github.com/aimat-lab/defog-adapt"
Upstream = "https://github.com/qym7/DeFoG"

[tool.hatch.build.targets.wheel]
packages = ["src/defog_megan"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/experiments",
    "/scripts",
    "/reproduce",
    "/tests",
    "/docs",
    "/README.md",
    "/CLAUDE.md",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/LICENSE",
    "/NOTICE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not parity'"
markers = [
    "parity: opt-in; needs the model zoo (DEFOG_MEGAN_ZOO), the torch build of the golden files and a long run",
]
